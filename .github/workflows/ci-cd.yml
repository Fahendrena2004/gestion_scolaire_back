name: CI/CD - Tests & Déploiement

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # JOB 1 : TESTER LE CODE
  tests:
    name: Job 1 - Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Installer Composer
        run: composer install --no-interaction
      
      - name: Configurer .env
        run: |
          cp .env.example .env
          php artisan key:generate
      
      - name: Lancer les migrations
        run: php artisan migrate --force
      
      - name: Lancer les tests
        run: php artisan test

  # JOB 2 : PREPARER LE DEPLOIEMENT
  prepare:
    name: Job 2 - Préparation
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Installer les dépendances
        run: composer install --no-dev --optimize-autoloader
      
      - name: Créer l'archive
        run: |
          zip -r deploy.zip . -x "*.git*" "*tests*" "*.env*"
      
      - name: Sauvegarder l'archive
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: deploy.zip

  # JOB 3 : DEPLOYER SUR DIRECTADMIN
  deploy:
    name: Job 3 - Déploiement
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: Récupérer l'archive
        uses: actions/download-artifact@v4
        with:
          name: application
      
      - name: Envoyer vers le serveur
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy.zip"
          target: "/home/${{ secrets.USERNAME }}/domains/api.edunova.mg/"
      
      - name: Installer sur le serveur
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/domains/api.edunova.mg/
            
            # Sauvegarde
            mv public_html public_html_old 2>/dev/null
            
            # Décompresser
            unzip -q deploy.zip -d public_html
            
            # Nettoyer
            rm -f deploy.zip
            
            # Aller dans le dossier
            cd public_html
            
            # Commands artisan
            php artisan config:cache
            php artisan migrate --force
            php artisan storage:link
            
            echo "✅ Déploiement terminé !"
